[project]
name = "bf2-www"
version = "0.1.0"
description = "A website for the BF2's frisbee team"
authors = [{ name = "Luko van der Maas", email = "me@luko.dev" }]
requires-python = ">=3.13,<3.15"
dependencies = [
    "django>=6.1.3,<6.2",
    "django-cms>=5.1.3,<6",
    "djangocms-text>=1.1.0,<2",
    "Pillow>=13.0.0,<14",
    "libsass>=0.23.0,<0.24",
    "ics>=0.7.3,<0.8",
    "django-filer>=3.6.0,<4",
    "django-import-export>=4.4.6,<5",
    "django-sass-processor>=1.4.2,<2",
    "django-compressor>=4.7.0,<5",
    "django-mail-template>=0.1.11,<0.2",
    "django-mptt>=0.22.0,<0.23",
    "django-bootstrap5>=26.4",
    "django-parler>=2.4,<3",
    "djangocms-versioning>=2.8.0,<3",
    "djangocms-alias>=3.2.0,<4",
    "djangocms-admin-style>=3.3.1,<4",
    "djangocms-frontend>=2.5.3,<3",
    "djangocms-file>=4.0.1,<5",
    "djangocms-picture>=4.1.1,<5",
    "djangocms-video>=3.2.0,<4",
    "djangocms-googlemap>=2.2.0,<3",
    "djangocms-style>=3.1.0,<4",
    "djangocms-column>=2.1.0,<3",
    "djangocms-snippet>=5.0.2,<6",
    "djangocms-link>=5.2.0,<6",
    "setuptools>=84.2.1",
    "google-auth>=2.40",
    "requests>=2.32",
]

[project.optional-dependencies]
production = [
    "gunicorn>=27.0.1,<28",
    "psycopg2-binary>=2.9.13,<3",
]

[dependency-groups]
dev = [
    "black>=26.10.1,<27",
]

[tool.uv.extra-build-dependencies]
"odfpy-1.4.1" = ["setuptools"]

[tool.uv]
package = false

# The project is not an installable package. nix (uv2nix) still builds the
# project itself, so tell setuptools there is nothing to package.
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.black]
exclude = '(/(\.eggs|\.git|\.tox)/|migrations)'
