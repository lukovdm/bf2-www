name: Check formatting, black
on: [push]
jobs:
  black:
    name: runner / black formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Use the black version from uv.lock, so CI formats like local development
      - name: Check formatting
        run: uv run --only-group dev black website --check
